<div class="faw">

  <!-- Floating bot bubble -->
  <button
    class="faw__bubble"
    [class.faw__bubble--open]="isOpen"
    [class.faw__bubble--hover]="isHovered"
    (click)="togglePanel()"
    (mouseenter)="isHovered = true"
    (mouseleave)="isHovered = false"
    aria-label="Open Finance AI Assistant"
    type="button">
    <svg class="faw__bot-face" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="12" y="16" width="40" height="32" rx="10" fill="white" opacity="0.95"/>
      <circle cx="24" cy="30" r="4.5" fill="#6366f1"/>
      <circle cx="40" cy="30" r="4.5" fill="#6366f1"/>
      <circle cx="25.5" cy="28.5" r="1.8" fill="white"/>
      <circle cx="41.5" cy="28.5" r="1.8" fill="white"/>
      <rect x="22" y="39" width="20" height="5" rx="2.5" fill="#6366f1"/>
      <line x1="32" y1="16" x2="32" y2="8" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="32" cy="6" r="3.5" fill="white"/>
      <rect x="7" y="26" width="7" height="10" rx="3" fill="white" opacity="0.8"/>
      <rect x="50" y="26" width="7" height="10" rx="3" fill="white" opacity="0.8"/>
    </svg>
    <span class="faw__pulse" *ngIf="!isOpen"></span>
  </button>

  <!-- Chat panel -->
  <div class="faw__panel" [class.faw__panel--visible]="isOpen" role="dialog" aria-label="Finance AI Agent">

    <!-- Header -->
    <header class="faw__header">
      <div class="faw__header-bot">
        <svg class="faw__header-avatar" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="12" y="16" width="40" height="32" rx="10" fill="white" opacity="0.9"/>
          <circle cx="24" cy="30" r="4.5" fill="#818cf8"/>
          <circle cx="40" cy="30" r="4.5" fill="#818cf8"/>
          <circle cx="25.5" cy="28.5" r="1.8" fill="white"/>
          <circle cx="41.5" cy="28.5" r="1.8" fill="white"/>
          <rect x="22" y="39" width="20" height="5" rx="2.5" fill="#818cf8"/>
          <line x1="32" y1="16" x2="32" y2="8" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
          <circle cx="32" cy="6" r="3.5" fill="white"/>
          <rect x="7" y="26" width="7" height="10" rx="3" fill="white" opacity="0.8"/>
          <rect x="50" y="26" width="7" height="10" rx="3" fill="white" opacity="0.8"/>
        </svg>
        <div class="faw__header-info">
          <h3 class="faw__header-title">Finance AI</h3>
          <span class="faw__header-status">
            <span class="faw__status-dot"></span>
            {{ isTyping ? (lang === 'fr' ? 'En train d\'écrire...' : 'Typing...') : (lang === 'fr' ? 'En ligne' : 'Online') }}
          </span>
        </div>
      </div>
      <div class="faw__header-controls">
        <button class="faw__ctrl-btn" type="button" (click)="toggleLang()" [title]="lang === 'en' ? 'Switch to French' : 'Passer en anglais'">
          {{ lang === 'en' ? 'FR' : 'EN' }}
        </button>
        <button class="faw__ctrl-btn faw__ctrl-btn--close" type="button" (click)="togglePanel()" aria-label="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Welcome card -->
    <div class="faw__welcome-card">
      <p class="faw__welcome-text">
        {{ lang === 'fr' ? 'Bonjour! Que puis-je faire pour vous aujourd\'hui?' : 'Hi! What do you want to do today?' }}
      </p>
    </div>

    <!-- Messages -->
    <div class="faw__messages" #messagesEl>
      <div
        *ngFor="let msg of messages"
        class="faw__msg"
        [class.faw__msg--user]="msg.role === 'user'"
        [class.faw__msg--bot]="msg.role === 'bot'">
        <div class="faw__msg-bubble">{{ msg.content }}</div>
        <span class="faw__msg-time">{{ msg.time }}</span>
      </div>

      <!-- Typing indicator -->
      <div class="faw__typing" *ngIf="isTyping">
        <span></span><span></span><span></span>
      </div>
    </div>

    <!-- Quick actions -->
    <div class="faw__quick">
      <button
        *ngFor="let action of quickActions"
        class="faw__quick-btn"
        type="button"
        (click)="sendQuick(action)">
        {{ action.label }}
      </button>
    </div>

    <!-- Composer -->
    <div class="faw__composer">
      <input
        class="faw__input"
        type="text"
        [(ngModel)]="draft"
        [disabled]="isTyping"
        (keyup.enter)="send()"
        [placeholder]="lang === 'fr' ? 'Décrivez votre tâche...' : 'Describe your task or ask a question'"
        autocomplete="off" />
      <button
        class="faw__voice-btn"
        type="button"
        [class.faw__voice-btn--active]="isListening"
        (click)="toggleVoice()"
        [title]="lang === 'fr' ? 'Saisie vocale' : 'Voice input'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="2" width="6" height="11" rx="3"/>
          <path d="M19 10a7 7 0 0 1-14 0"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/>
        </svg>
      </button>
      <button
        class="faw__send-btn"
        type="button"
        [disabled]="!draft.trim() || isTyping"
        (click)="send()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>

  </div>
</div>
