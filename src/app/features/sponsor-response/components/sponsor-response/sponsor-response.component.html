<div class="response-page">
  <header class="response-page__header">
    <div class="response-page__brand">Cluverse</div>
    <a class="response-page__home-link" href="/">Back to Home</a>
  </header>

  <main class="response-page__main">
    <section class="response-page__card">
      <span class="response-page__badge">{{ badge }}</span>
      <h1 class="response-page__title">{{ title }}</h1>
      <p class="response-page__message">{{ message }}</p>
      <a class="response-page__cta" href="/">Visit Cluverse</a>
    </section>
  </main>

  <footer class="response-page__footer">
    <div class="response-page__footer-inner">
      <p>&copy; 2026 Cluverse. All rights reserved.</p>
      <p>Designed & Developed by Hexateam</p>
    </div>
  </footer>
</div>
