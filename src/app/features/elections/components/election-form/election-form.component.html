<div class="list-container mx-auto p-6 max-w-3xl animate-fade-in relative text-gray-800">
  <div class="mb-6 pb-4 border-b">
    <h2 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-indigo-600">
      {{ isEditMode ? 'Edit Election' : 'Create New Election' }}
    </h2>
    <p class="text-gray-500 mt-2 font-medium">Manage the details and lifecycle of standard voting rounds.</p>
  </div>

  <div class="bg-white/70 backdrop-blur-md rounded-2xl shadow-xl border border-white/50 p-8">
    <form [formGroup]="electionForm" (ngSubmit)="onSubmit()" class="space-y-6">

      <div *ngIf="errorMessage" class="bg-red-50 text-red-600 p-4 rounded-xl border border-red-100 flex items-center space-x-3 text-sm font-bold shadow-sm">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/>
        </svg>
        <span>{{ errorMessage }}</span>
      </div>

      <div>
        <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Title <span class="text-red-500">*</span></label>
        <input type="text" formControlName="title"
          class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-4 focus:ring-blue-500/20 focus:border-blue-500 transition-all text-gray-800"
          placeholder="e.g. Student Council 2026">
        <p *ngIf="electionForm.get('title')?.invalid && electionForm.get('title')?.touched" class="text-red-500 text-xs mt-1 font-semibold">Title is required.</p>
      </div>

      <div>
        <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Description</label>
        <textarea formControlName="description" rows="3"
          class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-4 focus:ring-blue-500/20 focus:border-blue-500 transition-all text-gray-800 resize-none"
          placeholder="Brief description..."></textarea>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Start Date <span class="text-red-500">*</span></label>
          <input type="date" formControlName="startDate"
            class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-4 focus:ring-blue-500/20 focus:border-blue-500 transition-all text-gray-800">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">End Date <span class="text-red-500">*</span></label>
          <input type="date" formControlName="endDate"
            class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-4 focus:ring-blue-500/20 focus:border-blue-500 transition-all text-gray-800">
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Target Position <span class="text-red-500">*</span></label>
          <select formControlName="positionId"
            class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-4 focus:ring-blue-500/20 focus:border-blue-500 transition-all text-gray-800">
            <option [ngValue]="null">Select the position</option>
            <option *ngFor="let pos of availablePositions" [ngValue]="pos.id">{{ pos.name || 'Position ' + pos.id }}</option>
          </select>
          <p *ngIf="electionForm.get('positionId')?.invalid && electionForm.get('positionId')?.touched" class="text-red-500 text-xs mt-1 font-semibold">Position is required.</p>
        </div>
        <div *ngIf="isEditMode">
          <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Status <span class="text-red-500">*</span></label>
          <select formControlName="status"
            class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-4 focus:ring-blue-500/20 focus:border-blue-500 transition-all text-gray-800">
            <option value="OPEN">OPEN</option>
            <option value="CLOSED">CLOSED</option>
            <option value="ARCHIVED">ARCHIVED</option>
          </select>
        </div>
      </div>

      <div class="mt-8 pt-6 border-t border-gray-100 flex justify-end space-x-4">
        <a routerLink="/dashboard/elections/list" class="px-6 py-3 rounded-xl font-bold text-gray-600 bg-gray-100 hover:bg-gray-200 transition-all">
          Cancel
        </a>
        <button type="submit" [disabled]="isSubmitting || electionForm.invalid"
          class="px-8 py-3 rounded-xl font-bold text-white bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 shadow-md hover:shadow-lg transform hover:-translate-y-0.5 transition-all disabled:opacity-50 disabled:cursor-not-allowed">
          {{ isSubmitting ? 'Saving...' : (isEditMode ? 'Update Election' : 'Create Election') }}
        </button>
      </div>

    </form>
  </div>
</div>
