<div class="elections animate-fade-in" style="max-width: 600px;">
  <div class="elections__header">
    <div>
      <h2 class="elections__title">
        {{ isEditMode ? 'Edit Vote' : 'Cast Vote' }}
      </h2>
      <p class="elections__subtitle">Select the candidate you wish to cast your vote for.</p>
    </div>
  </div>

  <div class="elections__card">
    <form [formGroup]="voteForm" (ngSubmit)="onSubmit()" class="elections__form">

      <div *ngIf="errorMessage" class="elections__error-alert">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/>
        </svg>
        <span>{{ errorMessage }}</span>
      </div>

      <div style="display: flex; flex-direction: column; gap: 1rem;">
        <div class="elections__form-field">
          <label>Target Election <span style="color: var(--e-danger);">*</span></label>
          <select formControlName="electionId">
            <option [ngValue]="null">Select the election</option>
            <option *ngFor="let election of elections" [ngValue]="election.id">{{ election.title || 'Election ' + election.id }}</option>
          </select>
          <div *ngIf="voteForm.get('electionId')?.invalid && voteForm.get('electionId')?.touched" class="e-error-text">
            Valid Election is required.
          </div>
        </div>
        
        <div class="elections__form-field">
          <label>Target Candidate <span style="color: var(--e-danger);">*</span></label>
          <select formControlName="candidateId">
            <option [ngValue]="null">Select the candidate</option>
            <option *ngFor="let cand of candidates" [ngValue]="cand.id">{{ cand.userName || 'Candidate ' + cand.id }}</option>
          </select>
          <div *ngIf="voteForm.get('candidateId')?.invalid && voteForm.get('candidateId')?.touched" class="e-error-text">
            Valid Candidate is required.
          </div>
        </div>
      </div>

      <div class="elections__form-actions">
        <a routerLink="/dashboard/elections/votes" class="elections__btn elections__btn--secondary">
          Cancel
        </a>
        <button type="submit" [disabled]="isSubmitting || voteForm.invalid" class="elections__btn elections__btn--primary">
          {{ isSubmitting ? 'Processing...' : (isEditMode ? 'Update Vote' : 'Cast Vote') }}
        </button>
      </div>

    </form>
  </div>
</div>
