<div class="list-container mx-auto p-6 max-w-7xl animate-fade-in">
  <div class="flex justify-between items-center mb-6 border-b pb-4">
    <h2 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-purple-500 to-pink-600">Vote Registry</h2>
    <div class="flex space-x-4">
      <input 
        type="text" 
        class="search-input w-72 p-3 font-medium text-gray-700 bg-white border border-gray-200 rounded-xl shadow-sm focus:outline-none focus:ring-4 focus:ring-purple-500/20 transition-all"
        placeholder="Filter by Vote or Candidate ID..." 
        [(ngModel)]="searchTerm" 
        (input)="applyFilters()"
      />
    </div>
  </div>

  <div class="overflow-x-auto bg-white/70 backdrop-blur-md rounded-2xl shadow-xl border border-white/50">
    <table class="w-full text-left border-collapse">
      <thead>
        <tr class="bg-gradient-to-r from-gray-50 to-gray-100 text-gray-500 uppercase text-xs font-bold tracking-widest border-b border-gray-200">
          <th class="p-5 cursor-pointer hover:text-purple-600 transition-colors" (click)="sortBy('id')">Vote ID</th>
          <th class="p-5 cursor-pointer hover:text-purple-600 transition-colors" (click)="sortBy('timestamp')">Timestamp</th>
          <th class="p-5 cursor-pointer hover:text-purple-600 transition-colors" (click)="sortBy('isValid')">Valid</th>
          <th class="p-5 cursor-pointer hover:text-purple-600 transition-colors" (click)="sortBy('voteWeight')">Weight</th>
          <th class="p-5 cursor-pointer hover:text-purple-600 transition-colors" (click)="sortBy('candidate')">Candidate ID</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-gray-100 text-sm">
        <tr 
          *ngFor="let vote of filteredVotes | paginate: { itemsPerPage: itemsPerPage, currentPage: page }" 
          class="table-row group hover:bg-white/80 transition-all duration-300 transform"
        >
          <td class="p-5 text-gray-400 font-mono">{{ vote.id }}</td>
          <td class="p-5 text-gray-500 font-medium">{{ vote.timestamp | date:'medium' }}</td>
          <td class="p-5">
            <span class="px-3 py-1 bg-purple-100 text-purple-800 rounded-full text-xs font-bold">{{ vote.isValid ? 'Yes' : 'No' }}</span>
          </td>
          <td class="p-5 text-gray-800 font-bold group-hover:text-purple-600 transition-colors">{{ vote.voteWeight || 1 }}</td>
          <td class="p-5 text-gray-500 font-medium font-mono">{{ vote.candidate?.id || '?' }}</td>
        </tr>
      </tbody>
    </table>
    
    <div class="flex justify-between items-center p-5 bg-gray-50/50 border-t border-gray-100 rounded-b-2xl">
      <div class="text-xs text-gray-500 font-bold tracking-wider uppercase">
        Page {{ page }}
      </div>
      <pagination-controls (pageChange)="page = $event" class="modern-pagination text-sm font-semibold"></pagination-controls>
    </div>
  </div>
</div>
