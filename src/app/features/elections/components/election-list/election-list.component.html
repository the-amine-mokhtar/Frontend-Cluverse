<div class="list-container mx-auto p-6 max-w-7xl animate-fade-in">
  <div class="flex justify-between items-center mb-6 border-b pb-4">
    <h2 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-indigo-600">Elections Hub</h2>
    <div class="flex space-x-4">
      <input 
        type="text" 
        class="search-input w-72 p-3 font-medium text-gray-700 bg-white border border-gray-200 rounded-xl shadow-sm focus:outline-none focus:ring-4 focus:ring-blue-500/20 transition-all"
        placeholder="Search by title or status..." 
        [(ngModel)]="searchTerm" 
        (input)="applyFilters()"
      />
      <button class="bg-gradient-to-r from-blue-500 to-indigo-500 hover:from-blue-600 hover:to-indigo-600 text-white font-bold py-3 px-6 rounded-xl shadow-lg transform hover:-translate-y-1 transition-all">
        + New
      </button>
    </div>
  </div>

  <div class="overflow-x-auto bg-white/70 backdrop-blur-md rounded-2xl shadow-xl border border-white/50">
    <table class="w-full text-left border-collapse">
      <thead>
        <tr class="bg-gradient-to-r from-gray-50 to-gray-100 text-gray-500 uppercase text-xs font-bold tracking-widest border-b border-gray-200">
          <th class="p-5 cursor-pointer hover:text-blue-600 transition-colors" (click)="sortBy('id')">ID</th>
          <th class="p-5 cursor-pointer hover:text-blue-600 transition-colors" (click)="sortBy('title')">Title</th>
          <th class="p-5 cursor-pointer hover:text-blue-600 transition-colors" (click)="sortBy('startDate')">Start Date</th>
          <th class="p-5 cursor-pointer hover:text-blue-600 transition-colors" (click)="sortBy('endDate')">End Date</th>
          <th class="p-5 cursor-pointer hover:text-blue-600 transition-colors" (click)="sortBy('status')">Status</th>
          <th class="p-5 text-right rounded-tr-2xl">Actions</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-gray-100 text-sm">
        <tr 
          *ngFor="let election of filteredElections | paginate: { itemsPerPage: itemsPerPage, currentPage: page }" 
          class="table-row group hover:bg-white/80 transition-all duration-300 transform"
        >
          <td class="p-5 text-gray-400 font-mono">{{ election.id }}</td>
          <td class="p-5 text-gray-800 font-bold group-hover:text-blue-600 transition-colors">{{ election.title || 'N/A' }}</td>
          <td class="p-5 text-gray-500 font-medium">{{ election.startDate | date }}</td>
          <td class="p-5 text-gray-500 font-medium">{{ election.endDate | date }}</td>
          <td class="p-5">
            <span class="px-4 py-1.5 rounded-full text-[10px] font-black uppercase tracking-wider shadow-sm"
                  [ngClass]="{
                    'bg-green-100 text-green-700': election.status === 'ACTIVE',
                    'bg-yellow-100 text-yellow-700': election.status === 'PENDING',
                    'bg-gray-100 text-gray-600': election.status === 'COMPLETED'
                  }">
              {{ election.status || 'UNKNOWN' }}
            </span>
          </td>
          <td class="p-5 text-right space-x-2">
            <button class="text-indigo-400 hover:text-indigo-600 hover:bg-indigo-50 p-2.5 rounded-full transition-all" title="Edit">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />
              </svg>
            </button>
            <button class="text-rose-400 hover:text-rose-600 hover:bg-rose-50 p-2.5 rounded-full transition-all" title="Delete" (click)="deleteElection(election.id)">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
              </svg>
            </button>
          </td>
        </tr>
      </tbody>
    </table>
    
    <div class="flex justify-between items-center p-5 bg-gray-50/50 border-t border-gray-100 rounded-b-2xl">
      <div class="text-xs text-gray-500 font-bold tracking-wider uppercase">
        Page {{ page }}
      </div>
      <pagination-controls (pageChange)="page = $event" class="modern-pagination text-sm font-semibold"></pagination-controls>
    </div>
  </div>
</div>
