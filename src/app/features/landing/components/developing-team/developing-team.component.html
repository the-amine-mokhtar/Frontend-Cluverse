<!-- ═══════════════════════════════════════════════════════════
     DEVELOPING TEAM — Infinite Slider
     ═══════════════════════════════════════════════════════════ -->
<section class="team-section" id="team">
  <div class="team-container">
    
    <div class="team-header text-center">
      <h2>Meet The Team</h2>
      <p>The developers behind Cluverse</p>
    </div>

    <!-- Infinite Slider adapted from test.html -->
    <!-- Variables moved to SCSS and dynamic binding for quantity -->
    <div class="slider" [style.--imageQuantity]="teamMembers.length">
      <div class="list">
        
        <!-- Original 4 Items -->
        <div class="item" *ngFor="let member of teamMembers">
          <img [src]="member.image" [alt]="member.name" />
          <div class="hover-overlay">
            <a [href]="'mailto:' + member.email" class="email-btn">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect width="20" height="16" x="2" y="4" rx="2" />
                <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />
              </svg>
            </a>
          </div>
          <div class="member-name">
            {{ member.name }}
            <span class="member-role">{{ member.role }}</span>
          </div>
        </div>

        <!-- Duplicated 4 Items for Seamless Loop -->
        <div class="item" *ngFor="let member of teamMembers">
          <img [src]="member.image" [alt]="member.name" />
          <div class="hover-overlay">
            <a [href]="'mailto:' + member.email" class="email-btn">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect width="20" height="16" x="2" y="4" rx="2" />
                <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />
              </svg>
            </a>
          </div>
          <div class="member-name">
            {{ member.name }}
            <span class="member-role">{{ member.role }}</span>
          </div>
        </div>

      </div>
    </div>

  </div>
</section>
