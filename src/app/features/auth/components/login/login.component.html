<div class="main">
    
    <!-- Sign Up Form (Left Side Original) -->
    <div class="container a-container" id="a-container" [class.is-txl]="isSignUpActive">
        <form id="a-form" class="form" method="" action="">
            <h2 class="form_title title">Apply to add a new club</h2>
            <div class="form__group mt-first">
                <label class="form__label">Club Name</label>
                <input class="form__input" type="text" name="name" [(ngModel)]="clubForm.name" placeholder="Enter your club's name" />
            </div>
            
            <div class="form__group">
                <label class="form__label">Description</label>
                <input class="form__input" type="text" name="description" [(ngModel)]="clubForm.description" placeholder="Describe your club a little..." />
            </div>
            
            <div class="form__group">
                <label class="form__label">Activity Sector</label>
                <select class="form__input select-box" name="activitySector" [(ngModel)]="clubForm.activitySector" title="Secteur d'activité">
                    <option value="" disabled selected>Select an activity sector</option>
                    <option value="Technologies">Technologies & IT</option>
                    <option value="Engineering">Engineering</option>
                    <option value="Arts">Arts & Culture</option>
                    <option value="Sports">Sports</option>
                    <option value="Science">Science</option>
                    <option value="Social">Social & Humanitarian</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            
            <div class="form__group">
                <label class="form__label">Creation Date</label>
                <input class="form__input" type="date" name="creationDate" [(ngModel)]="clubForm.creationDate" placeholder="Date the club was founded" title="Creation Date" />
            </div>

            <div class="form__group">
                <label class="form__label">Email Address</label>
                <input class="form__input" type="email" name="email" [(ngModel)]="clubForm.email" placeholder="Enter contact email address" />
            </div>
            
            <div class="form__group">
                <label class="form__label">Status</label>
                <select class="form__input select-box" name="status" [(ngModel)]="clubForm.status">
                    <option value="" disabled selected>Select current status</option>
                    <option value="Active">Active</option>
                    <option value="Pending">Pending Validation</option>
                    <option value="Inactive">Inactive</option>
                </select>
            </div>

            <div class="form__group">
                <label class="form__label">Club Logo</label>
                <!-- Image Upload & Crop Area -->
                <div class="form__input file-upload" *ngIf="!imageChangedEvent">
                    <span class="file-label">Upload Club Logo</span>
                    <input type="file" accept="image/*" class="file-input" (change)="fileChangeEvent($event)" />
                </div>
                <div class="image-preview form__input" *ngIf="croppedImage && !showCropper">
                    <img [src]="croppedImage" alt="Cropped Logo" class="cropped-img" />
                    <span class="preview-text">Logo selected!</span>
                    <button class="delete-btn" (click)="removeImage($event)" title="Delete image">
                        <!-- SVG Trash Icon -->
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                    </button>
                </div>
            </div>

            <button class="form__button button submit" (click)="submitApplication($event)">APPLY</button>
        </form>
    </div>
    
    <!-- Sign In Form (Right Side Original) -->
    <div class="container b-container" id="b-container" [class.is-txl]="isSignUpActive" [class.is-z200]="isSignUpActive">
        <form id="b-form" class="form" method="" action="">
            <h2 class="form_title title">Login in to your club portail</h2>
            
            <div class="form__group">
                <label class="form__label">Club Selection</label>
                <select class="form__input" (change)="onClubSelect($event)" [value]="selectedClub">
                    <option value="" disabled selected>Select your club</option>
                    <option *ngFor="let club of clubs" [value]="club">{{ club }}</option>
                </select>
            </div>
            
            <div class="form__group">
                <label class="form__label">Identifier</label>
                <input class="form__input" type="text" placeholder="Enter your Identifier" [disabled]="!selectedClub" />
            </div>

            <div class="form__group">
                <label class="form__label">Password</label>
                <input class="form__input" type="password" placeholder="Enter your Password" [disabled]="!selectedClub" />
            </div>
            <a class="form__link">Forgot your password?</a>
            <button class="form__button button submit" (click)="$event.preventDefault()" [disabled]="!selectedClub">SIGN IN</button>
        </form>
    </div>
    
    <!-- Sliding Overlay Module -->
    <div class="switch" id="switch-cnt" [class.is-txr]="isSignUpActive" [class.is-gx]="isAnimating">
        <div class="switch__circle" [class.is-txr]="isSignUpActive"></div>
        <div class="switch__circle switch__circle--t" [class.is-txr]="isSignUpActive"></div>
        
        <!-- Welcome Back Content -->
        <div class="switch__container" id="switch-c1" [class.is-hidden]="isSignUpActive">
            <h2 class="switch__title title">Welcome Back !</h2>
            <p class="switch__description description">To keep connected with us please login with your personal info</p>
            <button class="switch__button button switch-btn" (click)="toggleForm($event)">SIGN IN</button>
        </div>
        
        <!-- Hello Friend Content -->
        <div class="switch__container" id="switch-c2" [class.is-hidden]="!isSignUpActive">
            <h2 class="switch__title title">Hello Friend !</h2>
            <p class="switch__description description">Enter your personal details and start journey with us</p>
            <button class="switch__button button switch-btn" (click)="toggleForm($event)">SIGN UP</button>
        </div>
    </div>
</div>

<!-- Fullscreen Cropper Modal -->
<div class="cropper-modal" *ngIf="imageChangedEvent && showCropper">
    <div class="cropper-modal-content">
        <h3 class="cropper-modal-title">Adjust Club Logo</h3>
        <image-cropper 
            [imageChangedEvent]="imageChangedEvent"
            [maintainAspectRatio]="true"
            [aspectRatio]="1 / 1"
            format="png"
            (imageCropped)="imageCropped($event)"
            (imageLoaded)="imageLoaded()"
            (cropperReady)="cropperReady()"
            (loadImageFailed)="loadImageFailed()"
            class="my-cropper">
        </image-cropper>
        <div class="cropper-modal-actions">
            <button class="button cancel-btn" (click)="removeImage($event)">Cancel</button>
            <button class="button" (click)="acceptCrop($event)">Crop & Use</button>
        </div>
    </div>
</div>
