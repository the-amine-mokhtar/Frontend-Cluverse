<div class="page">
  <div class="card">

    <ng-container *ngIf="!submitted">
      <h2 class="title">Forgot Password</h2>
      <p class="subtitle">Enter your email address and complete the security check. We'll send you a reset link.</p>

      <div class="form__group">
        <label class="form__label">Email Address</label>
        <input
          class="form__input"
          type="email"
          [(ngModel)]="email"
          placeholder="Enter your email"
          name="email"
        />
      </div>

      <div class="captcha-wrapper">
        <re-captcha
          (resolved)="onCaptchaResolved($event)"
          [siteKey]="siteKey">
        </re-captcha>
      </div>

      <div class="error-msg" *ngIf="error">{{ error }}</div>

      <button
        class="button"
        (click)="submit()"
        [disabled]="!email || !captchaToken || loading">
        {{ loading ? 'Sending...' : 'Send Reset Link' }}
      </button>

      <a class="back-link" routerLink="/auth/login">← Back to login</a>
    </ng-container>

    <ng-container *ngIf="submitted">
      <div class="success-icon">✓</div>
      <h2 class="title">Check your inbox</h2>
      <p class="subtitle">
        We sent a password reset link to <strong>{{ email }}</strong>.
        Check your spam folder if you don't see it.
      </p>
      <a class="button" routerLink="/auth/login">Back to login</a>
    </ng-container>

  </div>
</div>
