<div class="page">
  <div class="card">

    <ng-container *ngIf="!success">
      <h2 class="title">Reset Password</h2>
      <p class="subtitle">Enter your new password below.</p>

      <div class="form__group">
        <label class="form__label">New Password</label>
        <input
          class="form__input"
          type="password"
          [(ngModel)]="newPassword"
          placeholder="Min. 8 characters"
          name="newPassword"
        />
        <span class="hint" *ngIf="newPassword && newPassword.length < 8">
          At least 8 characters required.
        </span>
      </div>

      <div class="form__group">
        <label class="form__label">Confirm Password</label>
        <input
          class="form__input"
          type="password"
          [(ngModel)]="confirmPassword"
          placeholder="Repeat your password"
          name="confirmPassword"
        />
        <span class="error-inline" *ngIf="passwordMismatch">Passwords do not match.</span>
      </div>

      <div class="error-msg" *ngIf="error">{{ error }}</div>

      <button
        class="button"
        (click)="submit()"
        [disabled]="!isValid || loading">
        {{ loading ? 'Resetting...' : 'Reset Password' }}
      </button>

      <a class="back-link" routerLink="/auth/login">← Back to login</a>
    </ng-container>

    <ng-container *ngIf="success">
      <div class="success-icon">✓</div>
      <h2 class="title">Password reset!</h2>
      <p class="subtitle">Your password has been changed. Redirecting to login...</p>
    </ng-container>

  </div>
</div>
