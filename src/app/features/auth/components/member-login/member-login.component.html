<form id="b-form" class="form">
    <h2 class="form_title title">Login to your club portal</h2>
    
    <div class="form__group">
        <label class="form__label">Club Selection</label>
        <select class="form__input" (change)="onClubSelect($event)" [(ngModel)]="loginForm.clubName" name="clubName">
            <option value="" disabled selected>Select your club</option>
            <option *ngFor="let club of clubs" [value]="club">{{ club }}</option>
        </select>
    </div>

    <div class="form__group">
        <label class="form__label">Identifier</label>
        <input class="form__input" type="text" name="connectionIdentifier" placeholder="Enter your Identifier" [(ngModel)]="loginForm.connectionIdentifier" [disabled]="!loginForm.clubName" />
    </div>

    <div class="form__group">
        <label class="form__label">Password</label>
        <input class="form__input" type="password" name="password" placeholder="Enter your Password" [(ngModel)]="loginForm.password" [disabled]="!loginForm.clubName" />
    </div>

    <a class="form__link">Forgot your password?</a>
    <button class="form__button button submit" (click)="submitLogin($event)" [disabled]="!loginForm.clubName">SIGN IN</button>
</form>
