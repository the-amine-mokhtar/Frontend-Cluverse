<div class="sidebar" [class.sidebar--visible]="showSidebar">

  <!-- Top: Logo + Close -->
  <div class="sidebar__top">
    <div class="sidebar__logo-area">
      <img src="assets/logos/LogoSimple.png" alt="Logo" class="sidebar__logo" style="width: 40px; height: 40px; object-fit: contain;">
      <span class="sidebar__logo-text">Cluverse</span>
      <button class="sidebar__close-btn" (click)="onClose()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Middle: Nav -->
  <div class="sidebar__body">

    <!-- Club card -->
    <div class="sidebar__club-card">
      <div class="sidebar__club-icon">
        <img *ngIf="dashState.clubLogoUrl$ | async as logoUrl"
             [src]="logoUrl"
             alt="Club logo"
             class="sidebar__club-logo" />
        <svg *ngIf="!(dashState.clubLogoUrl$ | async)"
             width="20" height="20" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93V18c0-.55.45-1 1-1s1 .45 1 1v1.93c-2.61-.47-4.74-2.18-5.66-4.45.6.34 1.31.52 2.03.52.93 0 1.78-.27 2.5-.73-.14-.01-.28-.04-.42-.04-.97 0-1.84-.42-2.45-1.08zM12 12c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/>
        </svg>
      </div>
      <div class="sidebar__club-info">
        <div class="sidebar__club-name">{{ (dashState.clubName$ | async) || 'Loading...' }}</div>
        <div class="sidebar__club-sub">Management Portal</div>
      </div>
    </div>

    <!-- Nav Items -->
    <nav class="sidebar__nav">
      <!-- Home -->
      <a class="sidebar__item"
         routerLink="/dashboard/home"
         routerLinkActive="sidebar__item--active"
         [routerLinkActiveOptions]="{ exact: true }">
        <svg class="sidebar__icon" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 19C10.067 19 8.317 18.2165 7.05 16.9498L12 12V5C15.866 5 19 8.134 19 12C19 15.866 15.866 19 12 19Z"/>
          <path fill-rule="evenodd" clip-rule="evenodd" d="M23 12C23 18.075 18.075 23 12 23C5.925 23 1 18.075 1 12C1 5.925 5.925 1 12 1C18.075 1 23 5.925 23 12ZM21 12C21 16.97 16.97 21 12 21C7.03 21 3 16.97 3 12C3 7.03 7.03 3 12 3C16.97 3 21 7.03 21 12Z"/>
        </svg>
        <span class="sidebar__item-label">Home</span>
      </a>

      <!-- Elections -->
      <a class="sidebar__item"
         routerLink="/dashboard/elections"
         routerLinkActive="sidebar__item--active">
        <svg class="sidebar__icon" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
          <path fill-rule="evenodd" clip-rule="evenodd" d="M3 5C3 3.343 4.343 2 6 2H14C17.866 2 21 5.134 21 9V19C21 20.657 19.657 22 18 22H6C4.343 22 3 20.657 3 19V5ZM13 4H6C5.448 4 5 4.448 5 5V19C5 19.552 5.448 20 6 20H18C18.552 20 19 19.552 19 19V9H13V4ZM18.584 7C17.941 5.529 16.611 4.427 15 4.1V7H18.584Z"/>
        </svg>
        <span class="sidebar__item-label">Elections</span>
      </a>

      <!-- Events -->
      <a class="sidebar__item"
         routerLink="/dashboard/events"
         routerLinkActive="sidebar__item--active">
        <svg class="sidebar__icon" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
          <path d="M19 22H5C3.895 22 3 21.105 3 20V6C3 4.895 3.895 4 5 4H7V2H9V4H15V2H17V4H19C20.105 4 21 4.895 21 6V20C21 21.105 20.105 22 19 22ZM5 10V20H19V10H5ZM5 6V8H19V6H5ZM17 14H7V12H17V14Z"/>
        </svg>
        <span class="sidebar__item-label">Events</span>
      </a>

      <!-- Recruitment -->
      <a class="sidebar__item"
         routerLink="/dashboard/recruitment"
         routerLinkActive="sidebar__item--active">
        <svg class="sidebar__icon" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
          <path d="M9 3C6.239 3 4 5.239 4 8C4 10.761 6.239 13 9 13C11.761 13 14 10.761 14 8C14 5.239 11.761 3 9 3ZM6 8C6 6.343 7.343 5 9 5C10.657 5 12 6.343 12 8C12 9.657 10.657 11 9 11C7.343 11 6 9.657 6 8Z"/>
          <path d="M16 21H14C14 18.239 11.761 16 9 16C6.239 16 4 18.239 4 21H2C2 17.134 5.134 14 9 14C12.866 14 16 17.134 16 21Z"/>
          <path d="M19 8V11H22V13H19V16H17V13H14V11H17V8H19Z"/>
        </svg>
        <span class="sidebar__item-label">Recruitment</span>
      </a>

      <!-- Skills -->
      <a class="sidebar__item"
         routerLink="/dashboard/skills"
         routerLinkActive="sidebar__item--active">
        <svg class="sidebar__icon" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 3C8.686 3 6 5.686 6 9C6 11.22 7.21 13.15 9 14.19V17C9 17.55 9.45 18 10 18H14C14.55 18 15 17.55 15 17V14.19C16.79 13.15 18 11.22 18 9C18 5.686 15.314 3 12 3ZM13 16H11V15H13V16ZM13.85 12.85L13 13.28V13H11V13.28L10.15 12.85C8.87 12.19 8 10.68 8 9C8 6.79 9.79 5 12 5C14.21 5 16 6.79 16 9C16 10.68 15.13 12.19 13.85 12.85Z"/>
          <path d="M9 21H15V19H9V21Z"/>
        </svg>
        <span class="sidebar__item-label">Skills</span>
      </a>

      <!-- Logistics -->
      <a class="sidebar__item"
         routerLink="/dashboard/logistics"
         routerLinkActive="sidebar__item--active">
        <svg class="sidebar__icon" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
          <path d="M20 8H17V4H3C1.9 4 1 4.9 1 6V17H3C3 18.66 4.34 20 6 20C7.66 20 9 18.66 9 17H15C15 18.66 16.34 20 18 20C19.66 20 21 18.66 21 17H23V12L20 8ZM6 18.5C5.17 18.5 4.5 17.83 4.5 17C4.5 16.17 5.17 15.5 6 15.5C6.83 15.5 7.5 16.17 7.5 17C7.5 17.83 6.83 18.5 6 18.5ZM19.5 9.5L21.46 12H17V9.5H19.5ZM18 18.5C17.17 18.5 16.5 17.83 16.5 17C16.5 16.17 17.17 15.5 18 15.5C18.83 15.5 19.5 16.17 19.5 17C19.5 17.83 18.83 18.5 18 18.5Z"/>
        </svg>
        <span class="sidebar__item-label">Logistics</span>
      </a>

      <!-- Finance -->
      <a class="sidebar__item"
         routerLink="/dashboard/finance"
         routerLinkActive="sidebar__item--active">
        <svg class="sidebar__icon" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
          <path d="M11.8 10.9C9.53 10.31 8.8 9.7 8.8 8.75C8.8 7.66 9.81 6.9 11.5 6.9C13.28 6.9 13.94 7.75 14 9H16.21C16.14 7.28 15.09 5.7 13 5.19V3H10V5.16C8.06 5.58 6.5 6.84 6.5 8.77C6.5 11.08 8.41 12.23 11.2 12.9C13.7 13.5 14.2 14.38 14.2 15.31C14.2 16 13.71 17.1 11.5 17.1C9.44 17.1 8.63 16.18 8.5 15H6.32C6.44 17.19 8.08 18.42 10 18.83V21H13V18.85C14.95 18.48 16.5 17.35 16.5 15.3C16.5 12.46 14.07 11.49 11.8 10.9Z"/>
        </svg>
        <span class="sidebar__item-label">Finance</span>
      </a>

      <!-- Sponsorship -->
      <a class="sidebar__item"
         routerLink="/dashboard/sponsorship"
         routerLinkActive="sidebar__item--active">
        <svg class="sidebar__icon" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
          <path d="M11 7H13V9H11V7ZM11 11H13V17H11V11ZM12 2C6.48 2 2 6.48 2 12C2 17.52 6.48 22 12 22C17.52 22 22 17.52 22 12C22 6.48 17.52 2 12 2ZM12 20C7.59 20 4 16.41 4 12C4 7.59 7.59 4 12 4C16.41 4 20 7.59 20 12C20 16.41 16.41 20 12 20Z"/>
        </svg>
        <span class="sidebar__item-label">Sponsorship</span>
      </a>

      <!-- Members (disabled placeholder) -->
      <div class="sidebar__item sidebar__item--disabled">
        <svg class="sidebar__icon" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
          <path d="M2 4V18L6.8 14.4C7.146 14.14 7.567 14 8 14H16C17.105 14 18 13.105 18 12V4C18 2.895 17.105 2 16 2H4C2.895 2 2 2.895 2 4ZM4 14V4H16V12H7.334C6.901 11.999 6.48 12.139 6.134 12.4L4 14Z"/>
          <path d="M22 22V9C22 7.895 21.105 7 20 7V18L17.866 16.4C17.52 16.139 17.099 16 16.666 16H7C7 17.105 7.895 18 9 18H16C16.433 17.999 16.854 18.14 17.2 18.4L22 22Z"/>
        </svg>
        <span class="sidebar__item-label">Members</span>
        <span class="sidebar__badge">Soon</span>
      </div>
    </nav>
  </div>

  <!-- Bottom: User Profile -->
  <div class="sidebar__bottom">
    <div class="sidebar__user">
      <div class="sidebar__user-avatar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
        </svg>
      </div>
      <div class="sidebar__user-info">
        <div class="sidebar__user-name">{{ (dashState.userFullName$ | async) || 'Loading...' }}</div>
        <div class="sidebar__user-role">{{ (dashState.userRole$ | async) || '' }}</div>
      </div>
    </div>
  </div>
</div>

<!-- Mobile overlay backdrop -->
<div class="sidebar__backdrop" [class.sidebar__backdrop--visible]="showSidebar" (click)="onClose()"></div>
