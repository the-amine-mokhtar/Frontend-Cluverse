<div class="home">
  <div class="home__welcome-card">
    <div class="home__welcome-icon">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
      </svg>
    </div>
    <h2 class="home__welcome-title">Welcome to Cluverse</h2>
    <p class="home__welcome-sub">Your club management portal is ready. Use the sidebar to navigate.</p>
    <div class="home__stats">
      <div class="home__stat-card">
        <span class="home__stat-label">Elections</span>
        <span class="home__stat-value">{{ isLoading ? '—' : stats.elections }}</span>
      </div>
      <div class="home__stat-card">
        <span class="home__stat-label">Events</span>
        <span class="home__stat-value">{{ isLoading ? '—' : stats.events }}</span>
      </div>
      <div class="home__stat-card">
        <span class="home__stat-label">Members</span>
        <span class="home__stat-value">{{ isLoading ? '—' : stats.members }}</span>
      </div>
      <div class="home__stat-card">
        <span class="home__stat-label">Recruitments</span>
        <span class="home__stat-value">{{ isLoading ? '—' : stats.recruitments }}</span>
      </div>
    </div>
  </div>
</div>
